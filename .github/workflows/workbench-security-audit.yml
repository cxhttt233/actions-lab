name: Workbench Security Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout audit controller
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: controller

      - name: Checkout private Workbench repository
        uses: actions/checkout@v6
        with:
          repository: cxhttt233/hop-cronicle-workbench
          ref: main
          fetch-depth: 0
          persist-credentials: false
          ssh-key: ${{ secrets.WORKBENCH_DEPLOY_KEY }}
          path: target

      - name: Materialize pinned Workbench upstreams
        shell: bash
        working-directory: target
        run: python3 scripts/prepare.py

      - name: Prepare reports directory
        shell: bash
        run: mkdir -p reports

      - name: Gitleaks - git history and current tree
        shell: bash
        continue-on-error: true
        run: |
          set +e
          docker run --rm -v "$PWD/target:/repo" -v "$PWD/reports:/reports" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git \
            --report-format=json --report-path=/reports/gitleaks.json \
            --redact=100 --exit-code=1 /repo >/dev/null 2>&1
          echo $? > reports/gitleaks.exit

      - name: Trivy - vulnerabilities, secrets and misconfiguration
        shell: bash
        continue-on-error: true
        run: |
          set +e
          docker run --rm -v "$PWD/target:/repo:ro" -v "$PWD/reports:/reports" \
            aquasec/trivy:0.74.0 fs \
            --scanners vuln,misconfig,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json --output /reports/trivy.json /repo >/dev/null 2>&1
          echo $? > reports/trivy.exit

      - name: OSV-Scanner - dependency vulnerabilities
        shell: bash
        continue-on-error: true
        run: |
          set +e
          docker run --rm -v "$PWD/target:/src:ro" \
            ghcr.io/google/osv-scanner:v2.6.0 \
            scan source --recursive --format json /src \
            > reports/osv.json 2>/dev/null
          echo $? > reports/osv.exit

      - name: Semgrep - OWASP and language security rules
        shell: bash
        continue-on-error: true
        run: |
          set +e
          python3 -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install --disable-pip-version-check -q semgrep==1.177.0 >/dev/null 2>&1
          cd target
          /tmp/semgrep-venv/bin/semgrep scan \
            --config p/owasp-top-ten \
            --config p/java \
            --config p/javascript \
            --config p/docker \
            --json --output ../reports/semgrep.json . >/dev/null 2>&1
          echo $? > ../reports/semgrep.exit

      - name: Checkov - Docker, Compose and Actions hardening
        shell: bash
        continue-on-error: true
        run: |
          set +e
          python3 -m venv /tmp/checkov-venv
          /tmp/checkov-venv/bin/pip install --disable-pip-version-check -q checkov >/dev/null 2>&1
          /tmp/checkov-venv/bin/checkov -d target --skip-download --output json \
            > reports/checkov.json 2>/dev/null
          echo $? > reports/checkov.exit

      - name: Publish non-sensitive scan summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("reports")
          def load(name):
              try:
                  return json.loads((root/name).read_text(encoding="utf-8"))
              except Exception:
                  return None
          g = load("gitleaks.json")
          t = load("trivy.json")
          o = load("osv.json")
          s = load("semgrep.json")
          c = load("checkov.json")
          g_count = len(g) if isinstance(g, list) else 0
          t_vuln = t_secret = t_mis = 0
          if isinstance(t, dict):
              for r in t.get("Results") or []:
                  t_vuln += len(r.get("Vulnerabilities") or [])
                  t_secret += len(r.get("Secrets") or [])
                  t_mis += len(r.get("Misconfigurations") or [])
          osv_count = 0
          if isinstance(o, dict):
              for r in o.get("results") or []:
                  for p in r.get("packages") or []:
                      osv_count += len(p.get("vulnerabilities") or [])
          semgrep_count = len((s or {}).get("results") or []) if isinstance(s, dict) else 0
          checkov_failed = 0
          if isinstance(c, list):
              checkov_failed = sum(
                  int((section.get("summary") or {}).get("failed") or 0)
                  for section in c if isinstance(section, dict)
              )
          elif isinstance(c, dict):
              checkov_failed = int((c.get("summary") or {}).get("failed") or 0)
          lines = [
              "# Workbench security audit",
              "",
              "Detailed findings are intentionally not uploaded from this public repository.",
              "",
              f"- Gitleaks findings: {g_count}",
              f"- Trivy vulnerabilities: {t_vuln}",
              f"- Trivy secret findings: {t_secret}",
              f"- Trivy misconfigurations: {t_mis}",
              f"- OSV dependency findings: {osv_count}",
              f"- Semgrep findings: {semgrep_count}",
              f"- Checkov failed checks: {checkov_failed}",
          ]
          pathlib.Path("security-summary.md").write_text("\n".join(lines)+"\n", encoding="utf-8")
          PY
          cat security-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat security-summary.md

      - name: Encrypt detailed reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-report
          tar -czf /tmp/workbench-security-reports.tar.gz reports
          openssl rand -hex 32 > /tmp/report.pass
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in /tmp/workbench-security-reports.tar.gz \
            -out encrypted-report/workbench-security-reports.tar.gz.enc \
            -pass file:/tmp/report.pass
          openssl pkeyutl -encrypt \
            -pubin \
            -inkey controller/.github/security/workbench-report-public.pem \
            -in /tmp/report.pass \
            -out encrypted-report/report-key.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          rm -f /tmp/report.pass /tmp/workbench-security-reports.tar.gz

      - name: Upload encrypted audit reports
        uses: actions/upload-artifact@v6
        with:
          name: workbench-security-audit-encrypted
          path: encrypted-report/
          if-no-files-found: error
          retention-days: 3
